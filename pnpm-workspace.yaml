packages:
  - 'web'
  - 'studio'
  - 'search'
  - 'packages/energyvision'
  - 'packages/typescript-config'
minimumReleaseAge: 10080
# Ignore trust policy assuming they are safe due to their age
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true
trustPolicyExclude:
  # https://github.com/reduxjs/reselect/issues/752
  # might apply for @reduxjs/toolkit@2.9.2 by recharts@3.8.1
  - reselect@5.1.1
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: false
  unrs-resolver: true
overrides:
  tar: 7.5.22
  '@xmldom/xmldom': 0.8.15
  'lodash-es': 4.18.1
  'lodash': 4.18.1
  'undici': 7.30.1
  next: 16.4.1 #security update
  adm-zip: 0.6.1 #security update
  '@azure/msal-node@>=5.0.0-beta.0 <7.1.0': 7.1.0
  'dompurify@<=3.4.16': 3.4.17
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'glob@>=9.0.0 <=14.0.1': 14.0.2
  'handlebars@>=3.0.0 <=4.7.9': 4.7.10
  'js-yaml@<3.15.2': 3.15.2
  'minimatch@>=7.0.0 <11.0.1': 11.0.1
  'qs@>=6.7.0 <=6.16.0': 6.16.1
  'smol-toml@<=1.8.0': 1.9.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'uuid@<11.1.1': 11.1.1
  'vite@>=8.3.0 <=8.3.2': 8.3.3
  'zod@<4.6.6': 4.6.6
publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'
minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - next@16.4.1
