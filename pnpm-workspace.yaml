packages:
  - 'web'
  - 'studio'
  - 'search'
  - 'packages/energyvision'
  - 'packages/typescript-config'
minimumReleaseAge: 10080
# Ignore trust policy assuming they are safe due to their age
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true
trustPolicyExclude:
  # https://github.com/reduxjs/reselect/issues/752
  # might apply for @reduxjs/toolkit@2.9.2 by recharts@3.8.1
  - reselect@5.1.1
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: false
  unrs-resolver: true
overrides:
  tar: 7.5.22
  '@xmldom/xmldom': 0.8.15
  'lodash-es': 4.18.1
  'lodash': 4.18.1
  'undici': 7.29.1
  next: 16.4.1 #security update
  adm-zip: 0.6.1 #security update
  dompurify: 3.4.17 # GHSA-cg2g-xh64-v4q7
publicHoistPattern:
  - '*import-in-the-middle*'
  - '*require-in-the-middle*'
minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - next@16.4.1
  - dompurify@3.4.17 # GHSA-cg2g-xh64-v4q7
