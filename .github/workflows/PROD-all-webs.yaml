name: PROD - Deploy all webs
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  update-radix-config:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Generate internal config write token
        id: internal-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          owner: Equinor
          repositories: energyvision-internal
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout internal 🛎️
        id: checkout-internal
        uses: actions/checkout@v7
        with:
          repository: 'equinor/energyvision-internal'
          ref: main
          token: ${{ steps.internal-token.outputs.token }}
      - name: Promote preprod tag to prod 
        if: github.ref == 'refs/heads/main'
        shell: bash
        id: modify-radix
        run: |
          # Install pre-requisite
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install ruamel.yaml
          python ci/promoteAllToProduction.py web
          git remote set-url origin https://github.com/equinor/energyvision-internal.git
          if [[ `git status --porcelain` ]]
          then
            git commit -am "🚀 Deploy all web sites to production"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()

  deploy:
    needs: update-radix-config
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://equinor.com
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      # MAIN CLUSTER PLATFORM2
      - name: Deploy to Radix 🚀
        id: deploy-main
        uses: equinor/radix-github-actions@v2
        with:
          azure_client_id: 460b889f-89e0-4cc9-965c-31f3e7770226
          version: latest
      - run: rx create job deploy
          --context platform2
          -a equinor-web-sites
          -e ${{ secrets.ENV }}
          -f
        shell: bash

      - uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()

  store-image-tags:
    needs: deploy
    runs-on: ubuntu-latest
    outputs:
      WEB_SHA: ${{ steps.capture-web-sha.outputs.WEB_SHA }}
    steps:
      - name: Generate internal config write token
        id: internal-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          owner: Equinor
          repositories: energyvision-internal
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout internal 🛎️
        id: checkout-internal
        uses: actions/checkout@v7
        with:
          repository: 'equinor/energyvision-internal'
          ref: main
          token: ${{ steps.internal-token.outputs.token }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      # Check if this can be removed
      - name: Install dependencies
        run: |
          npm install js-yaml

      - name: Run script for 'web'
        id: capture-web-sha
        run: |
          WEB_SHA=$(node ci/storeImageTags.js web)
          echo "WEB_SHA=$WEB_SHA" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          git remote set-url origin https://github.com/equinor/energyvision-internal.git
          git add latest-prod-tags.json
          git commit -m "Update latest-prod-tags.json with new tags" || echo "No changes to commit"
          git push

  create-discussion-and-share:
    needs: [store-image-tags]
    runs-on: ubuntu-latest
    steps:
      - name: Generate release project token
        id: release-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          owner: Equinor
          repositories: energyvision
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-discussions: write
          permission-organization-projects: write
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: 'Move cards and create discussion and post it to channel'
        id: 'get-list'
        with:
          token: ${{ steps.release-token.outputs.token }}
          commitSHA: 'Web : ${{ needs.store-image-tags.outputs.WEB_SHA }}'
          slackWebhook: ${{ secrets.SLACK_WEBHOOK_RELEASE_ANNOUNCEMENT}}
        uses: ./.github/workflows/project/
