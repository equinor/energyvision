name: PROD - Deploy selected web site
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Name of web to deploy'
        required: true
        type: choice
        options:
          - global
          - secret
          - brazil
          - germany
          - argentina
          - poland
          - japan
          - storage
          - equinorfunds
          - celticsea
          - sponsorship
          - stemgapet
permissions:
  id-token: write
  contents: read
jobs:
  update-radix-config:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Generate internal config write token
        id: internal-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          owner: Equinor
          repositories: energyvision-internal
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout internal 🛎️
        id: checkout-internal
        uses: actions/checkout@v7
        with:
          repository: 'equinor/energyvision-internal'
          ref: main
          token: ${{ steps.internal-token.outputs.token }}
      - name: Promote preprod tag to prod 🗒️
        if: github.ref == 'refs/heads/main'
        shell: bash
        id: modify-radix
        run: |
          # Install pre-requisite
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install ruamel.yaml
          python ci/promoteToProduction.py web ${{ github.event.inputs.site }}
          git remote set-url origin https://github.com/equinor/energyvision-internal.git
          if [[ `git status --porcelain` ]]
          then
            git commit -am "🚀 Deploy web for ${{ github.event.inputs.site }} to production"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()

  deploy:
    needs: update-radix-config
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://equinor.com
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Deploy website on Radix 🚀
        id: deploy
        uses: equinor/radix-github-actions@v2
        with:
          azure_client_id: 460b889f-89e0-4cc9-965c-31f3e7770226
          version: 'v1.37.1'
      - run: rx create job deploy
          --context platform2
          -a equinor-web-sites
          -e ${{ secrets.ENV }}
          -f
        shell: bash

      - uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()
