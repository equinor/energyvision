name: Delete old ghrc images
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # every sunday at midnight
permissions:
  id-token: write
jobs:
  clean-ghcr:
    name: Delete old unused container images
    runs-on: ubuntu-latest
    permissions: 
      packages: write
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: "Escape GitHub App PEM"
        id: github-app
        run: |
          pem_escaped=${{ secrets.GH_APP_PRIVATE_KEY }//$'\n'/\\n}
          echo "::add-mask::$pem_escaped"
          echo "app_pem=$pem_escaped" >> "$GITHUB_OUTPUT"
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          owner: ${{ github.repository_owner }}
          repositories: |
            energyvision-internal
          private-key: ${{ steps.github-app.outputs.app_pem }}
          permission-organization-packages: write

      - name: Checkout internal 🛎️
        id: checkout-internal
        uses: actions/checkout@v7
        with:
          repository: 'equinor/energyvision-internal'
          ref: main
          ssh-token: ${{ steps.generate-token.outputs.token }}

      - name: Get tags to keep from latest-prod-tags.json
        id: get-tags
        run: |
          TAGS=$(jq -r '[.web + .studio | unique[]] | join(", ")' latest-prod-tags.json)
          echo "TAGS_TO_KEEP=$TAGS" >> $GITHUB_ENV
          echo "TAGS TO KEEP: $TAGS"
   

      - name: Clean up Docker images
        id: delete-containers
        uses: snok/container-retention-policy@v2
        with:
          token: ${{ steps.generate-token.outputs.token }}
          account-type: org
          org-name: Equinor
          image-names: energyvision/*
          cut-off: a week ago UTC
          keep-at-least: 5
          skip-tags: ${{ env.TAGS_TO_KEEP }}, *-latest
          # dry-run: true

      - name: log-errors-to-slack 📄
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()
