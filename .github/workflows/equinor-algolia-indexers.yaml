name: Equinor Algolia indexers workflow
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment for algolia indexers'
        required: true
        type: choice
        options:
          - development
          - production
        default: development
  #push:
  #  branches:
  #    - main
  #    - staging
  #  paths:
  #    - 'search/**'
  #    - '!./README.md'
  #    - '!./.env.template'

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  DEPLOY_OUTPUT_PATH: ${{ github.workspace }}/deploy/search
  BUILD_PACKAGE_NAME: indexers.zip
  BUILD_ARTIFACT_PATH: ${{ github.workspace }}/build_artifacts
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  check-code:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production') || 'development'}}
    env:
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Install pnpm 📦
        id: install-pnpm
        uses: pnpm/action-setup@v6
      - name: Cache pnpm modules 💾
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          # cache: 'npm'
      - name: Install dependencies 🔧
        id: install-dependencies
        run: |
          pushd search
          pnpm install
          popd
      - name: Run tests 🔍
        id: test
        run: |
          pnpm search-indexers test
      - name: log-errors-to-slack 📄
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()

  build-function-application:
    needs: check-code
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production') || 'development'}}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Install pnpm 📦
        id: install-pnpm
        uses: pnpm/action-setup@v6
      - name: Cache pnpm modules 💾
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          # cache: 'npm'
      - name: Install dependencies 🔧
        id: install-dependencies
        run: |
          pnpm install --frozen-lockfile --filter ./search
      - name: Build ⚙
        id: build-functions
        run: |
          pnpm search-indexers build
      # pnpm deploy creates a self-contained copy of the search package with a flat,
      # symlink-free node_modules resolved from the shared lockfile. A plain hoisted
      # install puts dependencies in the workspace root, which never reaches the zip.
      - name: Package 📦
        id: package-functions
        run: |
          pnpm --filter ./search --prod deploy --frozen-lockfile \
            --config.inject-workspace-packages=true \
            --config.node-linker=hoisted \
            ${{ env.DEPLOY_OUTPUT_PATH }}
          test -f ${{ env.DEPLOY_OUTPUT_PATH }}/node_modules/@sanity/client/package.json
          mkdir ${{ env.BUILD_ARTIFACT_PATH }}
          pushd ${{ env.DEPLOY_OUTPUT_PATH }}
          zip -r ${{ env.BUILD_ARTIFACT_PATH }}/${{ env.BUILD_PACKAGE_NAME }} .
          popd
      - name: Package Azure Function release build
        id: package-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.AZ_ALGOLIA_FUNC_APP_NAME }}
          path: ${{ env.BUILD_ARTIFACT_PATH }}
      - name: log-errors-to-slack 📄
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()

  deploy-function-application:
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production') || 'development'}}
    needs: [build-function-application]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure 🌥️
        id: login-to-azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.ENVIS_ACTIONS_SERVICE_PRINCIPAL }}

      - name: 'Create output directory'
        shell: bash
        run: |
          mkdir ${{ env.BUILD_ARTIFACT_PATH }}

      # Fetch published code
      - name: Download Azure function release build
        id: download-artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ vars.AZ_ALGOLIA_FUNC_APP_NAME }}
          path: ${{ env.BUILD_ARTIFACT_PATH }}

      # Deploy Azure functions code
      - name: Run Azure Functions Action
        id: deploy
        uses: azure/functions-action@v1
        with:
          app-name: ${{ vars.AZ_ALGOLIA_FUNC_APP_NAME }}
          package: ${{ env.BUILD_ARTIFACT_PATH }}/${{ env.BUILD_PACKAGE_NAME }}

      - name: log-errors-to-slack 📄
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()
